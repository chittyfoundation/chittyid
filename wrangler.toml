name = "chittyid"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "0bc21e3a5a9de1a4cc843be9c3e98121"  # ChittyCorp LLC main account

# Production environment
[env.production]

# Route configuration for id.chitty.cc
[[env.production.routes]]
pattern = "id.chitty.cc/*"
zone_name = "chitty.cc"

# MCP Portal KV Storage - Using proper namespaces for production
[[env.production.kv_namespaces]]
binding = "MCP_SESSIONS"
id = "dd1dff525a27431aa47844eb364e6606"

[[env.production.kv_namespaces]]
binding = "OAUTH_TOKENS"
id = "0189885179514d639776ec3bfe8f8274"

[[env.production.kv_namespaces]]
binding = "API_KEYS"
id = "41593bb3096745c0b59e0bf6d5cbae20"

[[env.production.kv_namespaces]]
binding = "PLATFORM_CACHE"
id = "d66c1e709c72456fa21aaa0d02f2db5e"

[[env.production.kv_namespaces]]
binding = "PLATFORM_KV"
id = "d52d89c1eebd402b95719161d311e7df"

# ChittyID Sequential Counter Storage - CRITICAL for deterministic generation
[[env.production.kv_namespaces]]
binding = "CHITTYID_KV"
id = "ec782932b5f54c359d9aef2e28898bf9"

# Pending fallback error IDs - for replacement on next verification
[[env.production.kv_namespaces]]
binding = "CHITTYID_PENDING"
id = "ec782932b5f54c359d9aef2e28898bf9"  # TODO: Create dedicated namespace

# Ontology System KV bindings (using PLATFORM_KV for now)
[[env.production.kv_namespaces]]
binding = "SERVICE_REGISTRY"
id = "d52d89c1eebd402b95719161d311e7df"

[[env.production.kv_namespaces]]
binding = "SCHEMA_KV"
id = "d52d89c1eebd402b95719161d311e7df"

# AI binding for production
[env.production.ai]
binding = "AI"

# MCP Portal KV Storage - Using proper namespaces (base/development)
[[kv_namespaces]]
binding = "MCP_SESSIONS"
id = "dd1dff525a27431aa47844eb364e6606"  # AUTH_SESSIONS

[[kv_namespaces]]
