# Additional AI Gateway binding
[env.production]
AI_GATEWAY = "chittyrouter-ai-gateway"

# NotionSync Worker Configuration
[[kv_namespaces]]
binding = "DLQ"
id = "d209ee1d808344a7ac62680cc81e1bb0"

[vars]
NOTION_VERSION = "2022-06-28"

# Secrets (set via wrangler secret put)
