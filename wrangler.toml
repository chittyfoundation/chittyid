name = "chittyid-foundation"
main = "chittyid-service-worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "84f0f32886f1d6196380fe6cbe9656a8"

# Custom domain for Foundation service
[env.production]
routes = [
  { pattern = "id.chitty.cc/*", custom_domain = true }
]

# ChittyID Foundation KV Storage
[[kv_namespaces]]
binding = "CHITTYID_KV"
id = "chittyid-foundation-audit"

# ChittyOS Gateway Integration
[[kv_namespaces]]
binding = "CHITTYOS_CACHE"
id = "37ed6409b6344a7599a11b733d99390f"

[[kv_namespaces]]
binding = "REGISTRY_CACHE"
id = "e9636781ff6b45a19b01bd411900d863"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "chittyauth-prod"
database_id = "3e6d7891-12f3-4041-bff2-9c892ad3f1b8"

[[vectorize]]
binding = "CHITTY_VECTORS"
index_name = "chittyid-routing"

[ai]
binding = "AI"

# Analytics Engine (commented out for minimal deployment)
# [[analytics_engine_datasets]]
# binding = "CHITTY_ANALYTICS"

# ChittyRouter AI Gateway Integration
[[kv_namespaces]]
binding = "AI_CACHE"
id = "e9636781ff6b45a19b01bd411900d863"

# Durable Objects - commented out for Pages deployment
# [[durable_objects.bindings]]
# name = "AI_STATE_DO"
# class_name = "AIStateDurableObject"

# [[durable_objects.bindings]]
# name = "CHITTYCHAIN_DO"
# class_name = "ChittyChainDurableObject"

# R2 and Service bindings commented out for initial deployment
# [[r2_buckets]]
# binding = "DOCUMENT_STORAGE"
# bucket_name = "chittyid-documents"

# ChittyOS Service Bindings (commented out for minimal deployment)
# [[services]]
# binding = "CHITTY_ROUTER"
# service = "chittyrouter-gateway"

# [[services]]
# binding = "CHITTY_TRUST"
# service = "chittytrust-6d-engine"

# [[services]]
# binding = "CHITTY_LEDGER"
# service = "chittyledger-immutable"

# [[services]]
# binding = "CHITTY_TRACE"
# service = "chittytrace-forensics"

# [[services]]
# binding = "CHITTY_ASSETS"
# service = "chittyassets-blockchain"

# Additional AI Gateway binding
[env.production]
AI_GATEWAY = "chittyrouter-ai-gateway"

# NotionSync Worker Configuration
[[kv_namespaces]]
binding = "DLQ"
id = "d209ee1d808344a7ac62680cc81e1bb0"

[vars]
# ChittyID Foundation Configuration
CHITTYID_SERVICE_VERSION = "2.0.0"
CHITTYID_FOUNDATION_URL = "https://id.chitty.cc"
CHITTYID_FALLBACK_URL = "https://fallback.id.chitty.cc"

# ChittyOS Gateway Integration
CHITTYOS_GATEWAY_URL = "https://gateway.chitty.cc"
CHITTYOS_REGISTRY_URL = "https://registry.chitty.cc"
CHITTYOS_SCHEMA_URL = "https://schema.chitty.cc"

# drand Beacon Configuration
DRAND_BEACON_URL = "https://api.drand.sh/public/latest"

# Production Environment Variables
[env.production.vars]
ENVIRONMENT = "production"
CHITTYID_FOUNDATION_URL = "https://id.chitty.cc"

# Staging Environment Variables
[env.staging.vars]
ENVIRONMENT = "staging"
CHITTYID_FOUNDATION_URL = "https://staging.id.chitty.cc"

# Secrets (set via wrangler secret put)
# CHITTY_ID_TOKEN = "foundation-service-token"
# CHITTYID_API_KEY = "foundation-api-key"
# NEON_DATABASE_URL = "postgresql://user:pass@neon-host/chittyos?sslmode=require"
# CHITTYOS_SERVICE_TOKEN = "gateway-integration-token"