name = "chittyid-mothership"
main = "worker.js"
compatibility_date = "2025-01-16"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "AUTH_CACHE"
id = "e9636781ff6b45a19b01bd411900d863"

[[kv_namespaces]]
binding = "CHITTYOS_CACHE"
id = "37ed6409b6344a7599a11b733d99390f"

[[kv_namespaces]]
binding = "SESSIONS"
id = "d209ee1d808344a7ac62680cc81e1bb0"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "chittyauth-prod"
database_id = "3e6d7891-12f3-4041-bff2-9c892ad3f1b8"

[[vectorize]]
binding = "CHITTY_VECTORS"
index_name = "chittyid-routing"

[ai]
binding = "AI"

# Analytics Engine (commented out for minimal deployment)
# [[analytics_engine_datasets]]
# binding = "CHITTY_ANALYTICS"

# ChittyRouter AI Gateway Integration
[[kv_namespaces]]
binding = "AI_CACHE"
id = "e9636781ff6b45a19b01bd411900d863"

# Durable Objects - commented out for Pages deployment
# [[durable_objects.bindings]]
# name = "AI_STATE_DO"
# class_name = "AIStateDurableObject"

# [[durable_objects.bindings]]
# name = "CHITTYCHAIN_DO"
# class_name = "ChittyChainDurableObject"

# R2 and Service bindings commented out for initial deployment
# [[r2_buckets]]
