id = "41593bb3096745c0b59e0bf6d5cbae20"  # API_KEYS

# Platform Cache and KV
[[kv_namespaces]]
binding = "PLATFORM_CACHE"
id = "d66c1e709c72456fa21aaa0d02f2db5e"

[[kv_namespaces]]
binding = "PLATFORM_KV"
id = "d52d89c1eebd402b95719161d311e7df"

# ChittyID Sequential Counter Storage - CRITICAL for deterministic generation
[[kv_namespaces]]
binding = "CHITTYID_KV"
id = "ec782932b5f54c359d9aef2e28898bf9"

# Pending fallback error IDs - for replacement on next verification
[[kv_namespaces]]
binding = "CHITTYID_PENDING"
id = "ec782932b5f54c359d9aef2e28898bf9"  # TODO: Create dedicated namespace

