<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChittyID RealtimeKit Video/Voice Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .auth-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .auth-section h2 {
            color: #444;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .video-section {
            display: none;
            margin-top: 30px;
        }

        .video-section.active {
            display: block;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .controls {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 10px 20px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover {
            background: #f8f9fa;
            border-color: #667eea;
        }

        .control-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .status-bar {
            background: #e8f4f8;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(40, 167, 69, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(40, 167, 69, 0);
            }
        }

        .participants-list {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .participants-list h3 {
            color: #444;
            margin-bottom: 15px;
        }

        .participant-item {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .participant-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .participant-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ChittyID RealtimeKit</h1>
            <p>Secure Video & Voice Communication Platform</p>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="connection-status">Ready</span>
            </div>
            <div id="room-info">No active room</div>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <div class="auth-section">
            <h2>Authentication</h2>
            <div class="form-group">
                <label for="chittyId">Your ChittyID</label>
                <input type="text" id="chittyId" placeholder="e.g., 01-1-USA-0001-P-2509-3-XX" />
            </div>
            <div class="form-group">
                <label for="roomId">Room ID (leave empty to create new)</label>
                <input type="text" id="roomId" placeholder="e.g., chitty-room-123" />
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="createRoom()">Create Room</button>
                <button class="btn btn-secondary" onclick="joinRoom()">Join Room</button>
            </div>
        </div>

        <div class="video-section" id="video-section">
            <div class="video-grid">
                <div class="video-container">
                    <video id="local-video" autoplay muted></video>
                    <div class="video-label">You</div>
                </div>
                <div class="video-container" id="remote-video-container" style="display: none;">
                    <video id="remote-video" autoplay></video>
                    <div class="video-label" id="remote-label">Remote User</div>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn active" id="mic-btn" onclick="toggleMic()">
                    🎤 Mic On
                </button>
                <button class="control-btn active" id="cam-btn" onclick="toggleCamera()">
                    📹 Camera On
                </button>
                <button class="control-btn" onclick="shareScreen()">
                    🖥️ Share Screen
                </button>
                <button class="btn btn-danger" onclick="leaveRoom()">
                    Leave Room
                </button>
            </div>

            <div class="participants-list">
                <h3>Participants</h3>
                <div id="participants"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { RealtimeKitClient } from './src/services/realtimekit.js';

        let client = null;
        let currentRoom = null;
        let localStream = null;
        let micEnabled = true;
        let cameraEnabled = true;

        window.createRoom = async function() {
            const chittyId = document.getElementById('chittyId').value;
            if (!chittyId) {
                showError('Please enter your ChittyID');
                return;
            }

            try {
                const response = await fetch('/api/realtime/rooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chittyId,
                        options: {
                            maxParticipants: 10,
                            enableVideo: true,
                            enableAudio: true
                        }
                    })
                });

                const data = await response.json();
                if (data.success) {
                    currentRoom = data.room;
                    document.getElementById('roomId').value = currentRoom.id;
                    showSuccess(`Room created: ${currentRoom.id}`);
                    await connectToRoom(currentRoom.id, chittyId);
                } else {
                    showError(data.error || 'Failed to create room');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        };

        window.joinRoom = async function() {
            const chittyId = document.getElementById('chittyId').value;
            const roomId = document.getElementById('roomId').value;

            if (!chittyId || !roomId) {
                showError('Please enter both ChittyID and Room ID');
                return;
            }

            try {
                const response = await fetch(`/api/realtime/rooms/${roomId}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chittyId,
                        metadata: { displayName: chittyId }
                    })
                });

                const data = await response.json();
                if (data.success) {
                    currentRoom = data.room;
                    showSuccess(`Joined room: ${roomId}`);
                    await connectToRoom(roomId, chittyId, data.token);
                } else {
                    showError(data.error || 'Failed to join room');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        };

        async function connectToRoom(roomId, chittyId, token) {
            document.getElementById('video-section').classList.add('active');
            document.getElementById('connection-status').textContent = 'Connecting...';
            document.getElementById('room-info').textContent = `Room: ${roomId}`;

            client = new RealtimeKitClient({
                sfuUrl: window.location.origin.replace('http', 'ws')
            });

            client.on('connected', () => {
                document.getElementById('connection-status').textContent = 'Connected';
                showSuccess('Connected to room');
            });

            client.on('participant-joined', (data) => {
                showSuccess(`${data.chittyId} joined the room`);
                updateParticipants();
            });

            client.on('participant-left', (data) => {
                showSuccess(`${data.chittyId} left the room`);
                updateParticipants();
                document.getElementById('remote-video-container').style.display = 'none';
            });

            client.on('track-added', (data) => {
                document.getElementById('remote-video-container').style.display = 'block';
                document.getElementById('remote-video').srcObject = data.stream;
                document.getElementById('remote-label').textContent = data.userId;
            });

            client.on('error', (error) => {
                showError('Connection error: ' + error.message);
            });

            client.on('disconnected', () => {
                document.getElementById('connection-status').textContent = 'Disconnected';
                showError('Disconnected from room');
            });

            if (!token) {
                token = btoa(JSON.stringify({
                    roomId,
                    userId: chittyId,
                    iat: Date.now(),
                    exp: Date.now() + 3600000
                }));
            }

            await client.connect(roomId, token);

            try {
                localStream = await client.publishLocalStream({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (error) {
                showError('Failed to access camera/microphone: ' + error.message);
            }
        }

        window.toggleMic = function() {
            if (!client) return;

            micEnabled = !micEnabled;
            if (micEnabled) {
                client.unmuteTrack('audio');
                document.getElementById('mic-btn').classList.add('active');
                document.getElementById('mic-btn').textContent = '🎤 Mic On';
            } else {
                client.muteTrack('audio');
                document.getElementById('mic-btn').classList.remove('active');
                document.getElementById('mic-btn').textContent = '🔇 Mic Off';
            }
        };

        window.toggleCamera = function() {
            if (!client) return;

            cameraEnabled = !cameraEnabled;
            if (cameraEnabled) {
                client.unmuteTrack('video');
                document.getElementById('cam-btn').classList.add('active');
                document.getElementById('cam-btn').textContent = '📹 Camera On';
            } else {
                client.muteTrack('video');
                document.getElementById('cam-btn').classList.remove('active');
                document.getElementById('cam-btn').textContent = '📷 Camera Off';
            }
        };

        window.shareScreen = async function() {
            if (!client) return;

            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });

                const videoTrack = screenStream.getVideoTracks()[0];
                const sender = client.pc.getSenders().find(s => s.track && s.track.kind === 'video');

                if (sender) {
                    sender.replaceTrack(videoTrack);
                }

                videoTrack.onended = () => {
                    if (localStream) {
                        const cameraTrack = localStream.getVideoTracks()[0];
                        if (sender && cameraTrack) {
                            sender.replaceTrack(cameraTrack);
                        }
                    }
                };

                showSuccess('Screen sharing started');
            } catch (error) {
                showError('Failed to share screen: ' + error.message);
            }
        };

        window.leaveRoom = function() {
            if (client) {
                client.disconnect();
                client = null;
            }

            document.getElementById('video-section').classList.remove('active');
            document.getElementById('connection-status').textContent = 'Ready';
            document.getElementById('room-info').textContent = 'No active room';
            document.getElementById('roomId').value = '';

            showSuccess('Left the room');
        };

        function updateParticipants() {
            // This would be populated from the server in a real implementation
            const participantsDiv = document.getElementById('participants');
            participantsDiv.innerHTML = `
                <div class="participant-item">
                    <div class="participant-info">
                        <div class="participant-avatar">Y</div>
                        <span>You (${document.getElementById('chittyId').value})</span>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
