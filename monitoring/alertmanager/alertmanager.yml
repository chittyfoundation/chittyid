global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@chitty.cc'
  smtp_auth_username: 'alerts@chitty.cc'
  smtp_auth_password: '${ALERTMANAGER_SMTP_PASSWORD}'
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 2m
      repeat_interval: 6h

    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 24h

    - match:
        component: security
      receiver: 'security-alerts'
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: 'default'
    slack_configs:
      - channel: '#chittyid-alerts'
        title: 'ChittyID Alert'
        text: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          {{ end }}

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@chitty.cc'
        subject: '[CRITICAL] ChittyID Alert: {{ .GroupLabels.alertname }}'
        body: |
          Critical alert fired for ChittyID system.

          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Component: {{ .Labels.component }}
          Runbook: {{ .Annotations.runbook_url }}

          Started: {{ .StartsAt }}
          {{ end }}

    slack_configs:
      - channel: '#chittyid-critical'
        username: 'ChittyID AlertManager'
        icon_emoji: ':rotating_light:'
        title: 'CRITICAL ALERT - {{ .GroupLabels.alertname }}'
        text: |
          :rotating_light: **CRITICAL ALERT** :rotating_light:

          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Service:** {{ .Labels.service }}
          **Component:** {{ .Labels.component }}
          **Runbook:** {{ .Annotations.runbook_url }}
          **Started:** {{ .StartsAt }}
          {{ end }}

    pagerduty_configs:
      - routing_key: '${PAGERDUTY_INTEGRATION_KEY}'
        description: 'ChittyID Critical Alert: {{ .GroupLabels.alertname }}'

  - name: 'warning-alerts'
    slack_configs:
      - channel: '#chittyid-alerts'
        username: 'ChittyID AlertManager'
        icon_emoji: ':warning:'
        title: 'WARNING - {{ .GroupLabels.alertname }}'
        text: |
          :warning: **WARNING** :warning:

          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Service:** {{ .Labels.service }}
          **Runbook:** {{ .Annotations.runbook_url }}
          {{ end }}

  - name: 'info-alerts'
    slack_configs:
      - channel: '#chittyid-info'
        username: 'ChittyID AlertManager'
        icon_emoji: ':information_source:'
        title: 'INFO - {{ .GroupLabels.alertname }}'
        text: |
          :information_source: **INFO**

          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          {{ end }}

  - name: 'security-alerts'
    email_configs:
      - to: 'security@chitty.cc'
        subject: '[SECURITY] ChittyID Security Alert: {{ .GroupLabels.alertname }}'
        body: |
          Security alert detected in ChittyID system.

          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Component: {{ .Labels.component }}
          Runbook: {{ .Annotations.runbook_url }}

          Started: {{ .StartsAt }}
          {{ end }}

          Please investigate immediately.

    slack_configs:
      - channel: '#chittyid-security'
        username: 'ChittyID Security'
        icon_emoji: ':shield:'
        title: 'SECURITY ALERT - {{ .GroupLabels.alertname }}'
        text: |
          :shield: **SECURITY ALERT** :shield:

          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Service:** {{ .Labels.service }}
          **Runbook:** {{ .Annotations.runbook_url }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  - source_match:
      alertname: 'ChittyIDPipelineDown'
    target_match:
      alertname: 'ChittyIDHighErrorRate'
    equal: ['service']